<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vòng xoay giao việc</title><style>
body{margin:0;background:#0b1020;color:#fff;font-family:system-ui}.w{max-width:900px;margin:auto;padding:24px}.g{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.c{background:#141b31;border-radius:20px;padding:18px}h1{text-align:center}.box{position:relative;max-width:500px;aspect-ratio:1;margin:auto}.p{position:absolute;left:50%;top:-5px;transform:translateX(-50%);z-index:2;border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid white}svg{width:100%;height:100%;transition:transform 4.5s cubic-bezier(.15,.7,.05,1)}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#111;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-weight:900}.ctrl{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}input,button{padding:13px;border-radius:12px;font-size:16px}input{background:#202944;color:#fff;border:1px solid #34405f}button{border:0;background:#7c5cff;color:#fff;font-weight:800}.r,.t,.h{margin-top:10px;padding:11px;border-radius:12px;background:#202944}.r{text-align:center;min-height:44px}.main{color:#ff9aae}.lock{opacity:.45;text-decoration:line-through}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;background:#283451}@media(max-width:750px){.g{grid-template-columns:1fr}.ctrl{grid-template-columns:1fr}}
</style></head><body><div class="w"><h1>🎯 Vòng xoay giao việc</h1><div class="g"><section class="c"><div class="box"><div class="p"></div><svg id="wheel" viewBox="0 0 500 500"></svg><div class="hub">XOAY</div></div><div class="ctrl"><input id="name" placeholder="Tên người xoay"><button id="spin">Xoay</button></div><div id="res" class="r">Chưa có kết quả.</div><div class="row"><button id="copy">🔗 Copy link cho người sau</button><button id="reset">↺ Reset</button></div></section><aside class="c"><h3>5 nhiệm vụ</h3><div id="tasks"></div><h3>Lịch sử</h3><div id="hist"></div></aside></div></div><script>
const T=[["discord",1,"Nghiên cứu kênh Discord"],["monitor",1,"Nghiên cứu monitor tool để buff hàng nhanh"],["sources",0,"Tổng hợp nguồn restock / chusen tiềm năng"],["alerts",0,"Nghiên cứu hệ thống cảnh báo Telegram / Discord"],["flow",0,"Test quy trình săn hàng từ tín hiệu đến bán ra"]],C=["#ff5b78","#7c5cff","#28d7a1","#34a8ff","#ffbd4a"];let cl=new Set,h=[],rot=0,busy=0;const q=s=>document.querySelector(s),E=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function P(r,d){let a=(d-90)*Math.PI/180;return[250+r*Math.cos(a),250+r*Math.sin(a)]}
function load(){let x=new URLSearchParams(location.hash.slice(1));(x.get("c")||"").split(",").filter(Boolean).forEach(v=>cl.add(v));try{h=JSON.parse(decodeURIComponent(atob(x.get("h")||"")))||[]}catch(e){}}
function save(){let x=new URLSearchParams;if(cl.size)x.set("c",[...cl]);if(h.length)x.set("h",btoa(encodeURIComponent(JSON.stringify(h.slice(-15)))));history.replaceState(null,"","#"+x)}
function draw(){let s=q("#wheel");s.innerHTML="";T.forEach((t,i)=>{let a=i*72,b=a+72,[x1,y1]=P(238,a),[x2,y2]=P(238,b),l=t[1]&&cl.has(t[0]),[x,y]=P(155,a+36);s.insertAdjacentHTML("beforeend",'<path d="M250 250 L'+x1+' '+y1+' A238 238 0 0 1 '+x2+' '+y2+' Z" fill="'+(l?"#4c5570":C[i])+'" stroke="#0b1020" stroke-width="5"/><g transform="translate('+x+' '+y+') rotate('+(a+36)+')"><text transform="rotate(90)" text-anchor="middle" fill="white" font-size="17" font-weight="800">'+(l?"🔒 Đã giao":(t[1]?"★ ":"")+t[2].slice(0,18))+'</text></g>')})}
function render(){draw();q("#tasks").innerHTML=T.map(t=>'<div class="t '+(t[1]&&cl.has(t[0])?"lock":"")+'"><b class="'+(t[1]?"main":"")+'">'+(t[1]?"CHÍNH":"PHỤ")+'</b> · '+E(t[2])+'</div>').join("");q("#hist").innerHTML=h.length?h.slice().reverse().map(x=>'<div class="h"><b>'+E(x.n)+'</b> → '+E(x.t)+'</div>').join(""):'<div>Chưa có ai xoay.</div>'}
q("#spin").onclick=()=>{if(busy)return;let n=q("#name").value.trim();if(!n){q("#res").textContent="Nhập tên trước.";return}let pool=T.filter(t=>!(t[1]&&cl.has(t[0]))),ch=pool[Math.floor(Math.random()*pool.length)],i=T.indexOf(ch),now=((rot%360)+360)%360,target=((324-i*72)%360+360)%360;busy=1;q("#spin").disabled=1;rot+=((target-now+360)%360)+1800;q("#wheel").style.transform='rotate('+rot+'deg)';q("#res").textContent="Đang xoay…";setTimeout(()=>{if(ch[1])cl.add(ch[0]);h.push({n:n,t:ch[2]});save();render();q("#wheel").style.transform='rotate('+rot+'deg)';q("#res").innerHTML='🎯 <b>'+E(n)+'</b> → <b>'+E(ch[2])+'</b>'+(ch[1]?'<br>🔒 Nhiệm vụ chính đã khóa.':'');q("#name").value="";busy=0;q("#spin").disabled=0},4600)}
q("#copy").onclick=async()=>{save();try{await navigator.clipboard.writeText(location.href);q("#copy").textContent="✅ Đã copy";setTimeout(()=>q("#copy").textContent="🔗 Copy link cho người sau",1200)}catch(e){prompt("Copy link:",location.href)}}
q("#reset").onclick=()=>{if(confirm("Reset toàn bộ?")){cl=new Set;h=[];rot=0;history.replaceState(null,"",location.pathname);q("#wheel").style.transform="rotate(0deg)";render()}};load();save();render();
</script></body></html>
